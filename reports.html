<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports · Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p id="banner" class="banner" hidden></p>
  <div class="shell">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="content">
      <header class="top">
        <button id="menuBtn" class="btn menu-btn" aria-label="Open menu">☰</button>
        <h1 class="ptitle left">Reports</h1>
        <span id="saveState" class="state"></span>
      </header>
      <main>
        <div class="monthbar">
          <button id="prev" class="btn" aria-label="Previous month">‹</button>
          <input type="month" id="month" aria-label="Month">
          <button id="next" class="btn" aria-label="Next month">›</button>
        </div>
        <section class="panelbox"><h2>Income vs Spend vs Investment</h2><div id="plot" class="plot"></div><p id="left" class="muted"></p></section>
        <section class="panelbox"><h2>Expenses by category</h2><div id="catbars"></div></section>
        <div class="rtop"><h2 class="sec">My reports</h2><button id="newReport" class="btn primary">＋ New report</button></div>
        <div id="myReports"></div>
      </main>
    </div>
  </div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="filters.js"></script>
  <script src="reportbuilder.js"></script>
  <script src="reports.js"></script>
</body>
</html>
