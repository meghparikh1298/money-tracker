<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings · Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p id="banner" class="banner" hidden></p>
  <div class="shell">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="content">
      <header class="top">
        <button id="menuBtn" class="btn menu-btn" aria-label="Open menu">☰</button>
        <h1 class="ptitle left">Settings</h1>
        <span id="saveState" class="state"></span>
      </header>
      <main>
        <p class="muted">Pick an item on the left to manage it. Existing entries keep the names they were saved with.</p>
        <div class="split">
          <nav id="nav" class="navlist" aria-label="Settings sections"></nav>
          <section id="detail" class="detail"></section>
        </div>
      </main>
    </div>
  </div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="settings.js"></script>
</body>
</html>
